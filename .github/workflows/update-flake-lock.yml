name: Update flake.lock

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - id: update
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          base: main
          branch: bot/flake-update
          commit-msg: "chore(flake): update flake.lock"
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            chore
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "${{ steps.update.outputs.pull-request-number }}"
