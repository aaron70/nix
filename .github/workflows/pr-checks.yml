name: PR Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format (alejandra)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.nix-files }}
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Flake Checker
        uses: DeterminateSystems/flake-checker-action@main

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix-files:
              - 'modules/**'
              - 'anvil/**'
              - '**.nix'
              - 'flake.lock'

  build:
    name: Build (${{ matrix.system }})
    if: needs.changes.outputs.nix-files
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      NIX_CONFIG: accept-flake-config = true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        timeout-minutes: 40
        continue-on-error: true

      - name: Build checks
        run: nix flake check -L --keep-going
