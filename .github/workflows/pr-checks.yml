name: PR Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    outputs:
      nix-files: ${{ steps.filter.outputs.nix-files }}
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Flake Checker
        uses: DeterminateSystems/flake-checker-action@main

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix-files:
              - 'modules/**'
              - 'anvil/**'
              - '**.nix'
              - 'flake.lock'

  build:
    name: Build (${{ matrix.system }})
    if: needs.checks.outputs.nix-files == 'true'
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          # - system: x86_64-linux
          #   runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      NIX_CONFIG: accept-flake-config = true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        timeout-minutes: 40
        continue-on-error: true

      - name: Build checks
        run: nix flake check -L --keep-going

      - name: Verify expected programs
        run: |
          toplevel=$(nix eval --raw \
            ".#darwinConfigurations.${{ matrix.host }}.system.outPath")

          if [ ! -d "$toplevel" ]; then
            echo "::error::system closure was not built: $toplevel"
            exit 1
          fi

          missing=0
          for bin in aerospace kitty zsh; do
            if [ -x "$toplevel/sw/bin/$bin" ]; then
              echo "ok: $bin"
            else
              echo "::error::expected program not found in build: $bin"
              missing=1
            fi
          done
          exit $missing
